<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="mac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4cc0"/>
      <stop offset="1" stop-color="#2a3590"/>
    </linearGradient>
    <linearGradient id="cham" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f9d8a"/>
      <stop offset="1" stop-color="#137565"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6378"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="18" fill="url(#bg)"/>

  <!-- Mac -->
  <rect x="40" y="135" width="240" height="200" rx="16" fill="url(#mac)"/>
  <rect x="75" y="165" width="170" height="100" rx="8" fill="#e9ecff"/>
  <rect x="145" y="265" width="30" height="16" fill="#c9cff5"/>
  <rect x="115" y="281" width="90" height="6" rx="3" fill="#c9cff5"/>
  <text x="160" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#2a3590">UniversalKM</text>
  <text x="160" y="231" text-anchor="middle" font-size="13" fill="#3b4cc0">в строке меню macOS</text>
  <text x="160" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Mac · мышь и клавиатура</text>

  <!-- Mac -> Android: cable and Wi-Fi (no extra hardware) -->
  <path d="M286 175 C 420 150, 600 110, 748 104" fill="none" stroke="#2f9e5a" stroke-width="3.5" marker-end="url(#arrg)"/>
  <text x="500" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6e3e">USB‑кабель</text>
  <text x="500" y="109" text-anchor="middle" font-size="12" fill="#3f6b52">AOA2 HID · ничего не включать</text>
  <path d="M286 215 C 430 200, 610 160, 748 146" fill="none" stroke="#2f9e5a" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrg)"/>
  <text x="520" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6e3e">Wi‑Fi</text>
  <text x="520" y="222" text-anchor="middle" font-size="12" fill="#3f6b52">ADB · встроенная утилита hid</text>

  <!-- Mac -> Chameleon -->
  <line x1="286" y1="300" x2="394" y2="330" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <text x="330" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#2b3245">USB‑C</text>

  <!-- Chameleon -->
  <rect x="400" y="275" width="196" height="130" rx="16" fill="url(#cham)"/>
  <rect x="428" y="295" width="140" height="42" rx="10" fill="#d8f5ef"/>
  <circle cx="448" cy="316" r="6" fill="#1f9d8a"/>
  <circle cx="468" cy="316" r="6" fill="#1f9d8a"/>
  <circle cx="488" cy="316" r="6" fill="#1f9d8a" opacity="0.5"/>
  <circle cx="508" cy="316" r="6" fill="#1f9d8a" opacity="0.5"/>
  <circle cx="528" cy="316" r="6" fill="#1f9d8a" opacity="0.3"/>
  <circle cx="548" cy="316" r="6" fill="#1f9d8a" opacity="0.3"/>
  <text x="498" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ChameleonUltra</text>
  <text x="498" y="386" text-anchor="middle" font-size="12" fill="#d8f5ef">nRF52840 · прошивка HID</text>

  <!-- Chameleon -> devices -->
  <path d="M602 300 C 670 270, 700 190, 748 166" fill="none" stroke="#5a6378" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#arr)"/>
  <path d="M602 350 L 748 350" fill="none" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <text x="675" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3245">BLE HID</text>

  <!-- Devices -->
  <g>
    <rect x="756" y="70" width="182" height="110" rx="14" fill="#ffffff" stroke="#2f9e5a" stroke-width="2"/>
    <rect x="776" y="90" width="34" height="62" rx="6" fill="none" stroke="#2f9e5a" stroke-width="3"/>
    <text x="824" y="118" font-size="15" font-weight="600" fill="#2b3245">Android</text>
    <text x="824" y="138" font-size="12" fill="#5a6378">телефон, планшет</text>
  </g>
  <g>
    <rect x="756" y="305" width="182" height="90" rx="14" fill="#ffffff" stroke="#c7cddb"/>
    <rect x="776" y="319" width="30" height="52" rx="6" fill="none" stroke="#3b4cc0" stroke-width="3"/>
    <text x="820" y="344" font-size="15" font-weight="600" fill="#2b3245">iPhone</text>
    <text x="820" y="364" font-size="12" fill="#5a6378">клавиатура, мышь</text>
  </g>

  <text x="480" y="445" text-anchor="middle" font-size="13" fill="#5a6378">До трёх устройств сразу · Android — без дополнительного железа</text>
</svg>
