<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="mac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4cc0"/>
      <stop offset="1" stop-color="#2a3590"/>
    </linearGradient>
    <linearGradient id="cham" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f9d8a"/>
      <stop offset="1" stop-color="#137565"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6378"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="18" fill="url(#bg)"/>

  <!-- Mac -->
  <rect x="40" y="110" width="250" height="200" rx="16" fill="url(#mac)"/>
  <rect x="80" y="140" width="170" height="100" rx="8" fill="#e9ecff"/>
  <rect x="150" y="240" width="30" height="16" fill="#c9cff5"/>
  <rect x="120" y="256" width="90" height="6" rx="3" fill="#c9cff5"/>
  <text x="165" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#2a3590">UniversalKM</text>
  <text x="165" y="206" text-anchor="middle" font-size="13" fill="#3b4cc0">macOS menu bar app</text>
  <text x="165" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Mac · mouse and keyboard</text>

  <!-- Links Mac -> Chameleon -->
  <line x1="296" y1="185" x2="424" y2="185" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <text x="360" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#2b3245">USB‑C</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#5a6378">netdata frames</text>
  <line x1="296" y1="250" x2="424" y2="250" stroke="#5a6378" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <text x="360" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#2b3245">Bluetooth</text>
  <text x="360" y="293" text-anchor="middle" font-size="12" fill="#5a6378">fallback NUS link</text>

  <!-- Chameleon -->
  <rect x="430" y="120" width="200" height="180" rx="16" fill="url(#cham)"/>
  <rect x="460" y="150" width="140" height="70" rx="10" fill="#d8f5ef"/>
  <circle cx="480" cy="185" r="6" fill="#1f9d8a"/>
  <circle cx="500" cy="185" r="6" fill="#1f9d8a"/>
  <circle cx="520" cy="185" r="6" fill="#1f9d8a" opacity="0.5"/>
  <circle cx="540" cy="185" r="6" fill="#1f9d8a" opacity="0.5"/>
  <circle cx="560" cy="185" r="6" fill="#1f9d8a" opacity="0.3"/>
  <circle cx="580" cy="185" r="6" fill="#1f9d8a" opacity="0.3"/>
  <text x="530" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ChameleonUltra</text>
  <text x="530" y="272" text-anchor="middle" font-size="12" fill="#d8f5ef">nRF52840 · HID firmware</text>

  <!-- Links Chameleon -> devices -->
  <path d="M636 175 C 700 130, 720 95, 762 92" fill="none" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M636 210 L 762 210" fill="none" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M636 245 C 700 290, 720 325, 762 328" fill="none" stroke="#5a6378" stroke-width="3" marker-end="url(#arr)"/>
  <text x="690" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2b3245">BLE HID</text>

  <!-- Devices -->
  <g>
    <rect x="770" y="52" width="150" height="80" rx="14" fill="#ffffff" stroke="#c7cddb"/>
    <rect x="790" y="66" width="30" height="52" rx="6" fill="none" stroke="#3b4cc0" stroke-width="3"/>
    <text x="835" y="90" font-size="15" font-weight="600" fill="#2b3245">Android</text>
    <text x="835" y="110" font-size="12" fill="#5a6378">phone</text>
  </g>
  <g>
    <rect x="770" y="170" width="150" height="80" rx="14" fill="#ffffff" stroke="#c7cddb"/>
    <rect x="786" y="182" width="40" height="56" rx="6" fill="none" stroke="#3b4cc0" stroke-width="3"/>
    <text x="838" y="208" font-size="15" font-weight="600" fill="#2b3245">Tablet</text>
    <text x="838" y="228" font-size="12" fill="#5a6378">Android, iPad</text>
  </g>
  <g>
    <rect x="770" y="288" width="150" height="80" rx="14" fill="#ffffff" stroke="#c7cddb"/>
    <rect x="790" y="302" width="30" height="52" rx="6" fill="none" stroke="#3b4cc0" stroke-width="3"/>
    <text x="835" y="326" font-size="15" font-weight="600" fill="#2b3245">iPhone</text>
    <text x="835" y="346" font-size="12" fill="#5a6378">keyboard</text>
  </g>

  <text x="480" y="400" text-anchor="middle" font-size="13" fill="#5a6378">Up to three devices at once · input goes to the one whose edge the cursor crossed</text>
</svg>
